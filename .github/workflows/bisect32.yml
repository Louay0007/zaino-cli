name: bisect32
true:
  push:
    tags:
    - rust-v*.*.*
env:
  CODEX_REPO_ROOT: ${{ github.workspace }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  argument-comment-lint-release-assets:
    name: argument-comment-lint release assets
    uses: ./.github/workflows/rust-release-argument-comment-lint.yml
    with:
      publish: true
  stage-npm-packages:
    name: stage npm packages
    if: "${{\n  !cancelled() &&\n  needs.build.result == 'success' &&\n  needs.build-windows.result\
      \ == 'success'\n}}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Download target artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: dist
        pattern: '{aarch64,x86_64}-{apple-darwin{,-app-server},unknown-linux-musl{,-app-server},pc-windows-msvc}'
    - name: Setup pnpm
      uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
      with:
        run_install: false
    - name: Setup Node.js for npm packaging
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version-file: .nvmrc
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Stage npm packages
      run: "release_version=\"${GITHUB_REF_NAME#rust-v}\"\n./scripts/stage_npm_packages.py\
        \ \\\n  --release-version \"$release_version\" \\\n  --artifacts-dir \"${GITHUB_WORKSPACE}/dist\"\
        \ \\\n  --package zaino \\\n  --package codex-responses-api-proxy \\\n  --package\
        \ codex-sdk\n"
    - name: Upload staged npm packages
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: npm-packages
        path: dist/npm/*.tgz
        if-no-files-found: error
  release:
    concurrency:
      group: rust-release
      cancel-in-progress: false
    needs:
    - argument-comment-lint-release-assets
    - stage-npm-packages
    if: "${{\n  always() &&\n  needs.tag-check.result == 'success' &&\n  needs.build.result\
      \ == 'success' &&\n  needs.build-windows.result == 'success' &&\n  needs.argument-comment-lint-release-assets.result\
      \ == 'success' &&\n  needs.stage-npm-packages.result == 'success' &&\n  needs.finalize-macos.result\
      \ != 'cancelled' &&\n  needs.finalize-macos.result != 'failure' &&\n  (needs.provisioned-macos-candidate.result\
      \ == 'success' ||\n    (vars.CODEX_PROVISIONED_MACOS_CANDIDATE != 'true' &&\n\
      \      needs.provisioned-macos-candidate.result == 'skipped'))\n}}"
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release_name.outputs.name }}
      tag: ${{ github.ref_name }}
      make_latest: ${{ steps.release_name.outputs.make_latest }}
      prerelease: ${{ steps.release_name.outputs.prerelease }}
      should_publish_npm: ${{ steps.npm_publish_settings.outputs.should_publish }}
      npm_tag: ${{ steps.npm_publish_settings.outputs.npm_tag }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Generate release notes from tag commit message
      id: release_notes
      shell: bash
      run: "set -euo pipefail\n\n# On tag pushes, GITHUB_SHA may be a tag object for\
        \ annotated tags;\n# peel it to the underlying commit.\ncommit=\"$(git rev-parse\
        \ \"${GITHUB_SHA}^{commit}\")\"\nnotes_path=\"${RUNNER_TEMP}/release-notes.md\"\
        \n\n# Use the commit message for the commit the tag points at (not the\n#\
        \ annotated tag message).\n# Preserve the previous publisher's 124,999-character\
        \ cap, reserving\n# the last character for a trailing newline for GitHub's\
        \ renderer.\ngit log -1 --format=%B \"${commit}\" |\n  python3 -c 'import\
        \ sys; print(sys.stdin.read()[:124998])' > \"${notes_path}\"\n\necho \"path=${notes_path}\"\
        \ >> \"${GITHUB_OUTPUT}\"\n"
    - name: Download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: dist
        pattern: '{{aarch64,x86_64}-{apple-darwin{,-app-server},unknown-linux-musl{,-app-server},pc-windows-msvc},*-symbols,argument-comment-lint-*,python-runtime-wheel-*,npm-packages}'
    - name: Download verified provisioned macOS packages
      if: vars.CODEX_PROVISIONED_MACOS_CANDIDATE == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: dist
        pattern: provisioned-macos-verified-candidate-*
    - name: Remove per-architecture checksum filenames before release upload
      if: vars.CODEX_PROVISIONED_MACOS_CANDIDATE == 'true'
      run: rm dist/provisioned-macos-verified-candidate-*/SHA256SUMS
    - name: List
      run: ls -R dist/
    - name: Add Codex package checksum manifest
      run: "set -euo pipefail\n\nmanifest=\"dist/codex-package_SHA256SUMS\"\ntmp_manifest=\"\
        $(mktemp)\"\nfind dist -type f \\\n  \\( -name 'codex-package-*.tar.gz' -o\
        \ -name 'codex-app-server-package-*.tar.gz' -o -name 'zaino-provisioned-package-*.tar.gz'\
        \ \\) \\\n  -print |\n  sort |\n  while IFS= read -r archive; do\n    sha256sum\
        \ \"$archive\" |\n      awk -v name=\"$(basename \"$archive\")\" '{ print\
        \ $1 \"  \" name }'\n  done > \"$tmp_manifest\"\n\nif [[ ! -s \"$tmp_manifest\"\
        \ ]]; then\n  echo \"No Codex package archives found for checksum manifest\"\
        \n  exit 1\nfi\n\nmv \"$tmp_manifest\" \"$manifest\"\ncat \"$manifest\"\n"
    - name: Add config schema release asset
      run: 'cp codex-rs/core/config.schema.json dist/config-schema.json

        '
    - name: Define release name
      id: release_name
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\n# Extract the version from the tag name, which is in\
        \ the format\n# \"rust-v0.1.0\".\nversion=\"${GITHUB_REF_NAME#rust-v}\"\n\
        echo \"name=${version}\" >> $GITHUB_OUTPUT\nif [[ \"${version}\" == *-* ]];\
        \ then\n  echo \"make_latest=false\" >> $GITHUB_OUTPUT\n  echo \"prerelease=true\"\
        \ >> $GITHUB_OUTPUT\nelse\n  make_latest=\"$(gh api \"repos/${GITHUB_REPOSITORY}/releases/latest\"\
        \ \\\n    | python3 .github/scripts/releases.py \"$version\" --check-github\
        \ latest)\"\n  echo \"make_latest=${make_latest}\" >> $GITHUB_OUTPUT\n  echo\
        \ \"prerelease=false\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Determine npm publish settings
      id: npm_publish_settings
      env:
        VERSION: ${{ steps.release_name.outputs.name }}
      run: "set -euo pipefail\nversion=\"${VERSION}\"\n\nif [[ \"${version}\" =~ ^[0-9]+\\\
        .[0-9]+\\.[0-9]+$ ]]; then\n  echo \"should_publish=true\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"npm_tag=\" >> \"$GITHUB_OUTPUT\"\nelif [[ \"${version}\" =~ ^[0-9]+\\\
        .[0-9]+\\.[0-9]+-alpha\\.[0-9]+(\\.[0-9]+)?$ ]]; then\n  echo \"should_publish=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"npm_tag=alpha\" >> \"$GITHUB_OUTPUT\"\n\
        else\n  echo \"should_publish=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"npm_tag=\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_NAME: ${{ steps.release_name.outputs.name }}
        RELEASE_NOTES: ${{ steps.release_notes.outputs.path }}
        MAKE_LATEST: ${{ steps.release_name.outputs.make_latest }}
        PRERELEASE: ${{ steps.release_name.outputs.prerelease }}
      run: bash .github/scripts/publish-github-release.sh
  publish-r2-assets:
    name: publish-r2-assets
    needs:
    - release
    if: ${{ !cancelled() && needs.release.result == 'success' && vars.ZAINO_PUBLISH_R2
      == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/r2-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.release.outputs.tag }}
      make_latest: ${{ fromJSON(needs.release.outputs.make_latest) }}
      prerelease: ${{ fromJSON(needs.release.outputs.prerelease) }}
      stage: assets
  publish-r2:
    concurrency:
      group: rust-release
      cancel-in-progress: false
    name: publish-r2
    needs:
    - release
    - publish-dotslash
    - publish-r2-assets
    if: "${{\n  !cancelled() &&\n  needs.release.result == 'success' &&\n  needs.publish-dotslash.result\
      \ == 'success' &&\n  needs.publish-r2-assets.result == 'success'\n}}"
    permissions:
      contents: read
    uses: ./.github/workflows/r2-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.release.outputs.tag }}
      make_latest: ${{ fromJSON(needs.release.outputs.make_latest) }}
      prerelease: ${{ fromJSON(needs.release.outputs.prerelease) }}
      stage: finalize
  publish-dotslash:
    name: publish-dotslash
    needs:
    - release
    if: ${{ !cancelled() && needs.release.result == 'success' && vars.ZAINO_PUBLISH_DOTSLASH
      == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: ./.github/actions/publish-dotslash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ github.ref_name }}
        configs: '.github/dotslash-config.json

          .github/dotslash-argument-comment-lint-config.json

          '
    - name: Publish the provisioned macOS package manifest
      if: vars.CODEX_PROVISIONED_MACOS_CANDIDATE == 'true'
      uses: facebook/dotslash-publish-release@9c9ec027515c34db9282a09a25a9cab5880b2c52
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ github.ref_name }}
        config: .github/dotslash-provisioned-config.json
  publish-npm:
    concurrency:
      group: rust-release
      cancel-in-progress: false
    if: "${{\n  !cancelled() &&\n  needs.release.result == 'success' &&\n  needs.release.outputs.should_publish_npm\
      \ == 'true'\n}}"
    name: publish-npm
    needs:
    - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version-file: .nvmrc
        registry-url: https://registry.npmjs.org
    - name: Download npm tarballs from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.release.outputs.tag }}
        RELEASE_VERSION: ${{ needs.release.outputs.version }}
      run: "set -euo pipefail\nversion=\"$RELEASE_VERSION\"\ntag=\"$RELEASE_TAG\"\n\
        mkdir -p dist/npm\npatterns=(\n  \"zaino-npm-${version}.tgz\"\n  \"zaino-npm-linux-*-${version}.tgz\"\
        \n  \"zaino-npm-darwin-*-${version}.tgz\"\n  \"zaino-npm-win32-*-${version}.tgz\"\
        \n  \"codex-responses-api-proxy-npm-${version}.tgz\"\n  \"codex-sdk-npm-${version}.tgz\"\
        \n)\nfor pattern in \"${patterns[@]}\"; do\n  gh release download \"$tag\"\
        \ \\\n    --repo \"${GITHUB_REPOSITORY}\" \\\n    --pattern \"$pattern\" \\\
        \n    --dir dist/npm\ndone\n"
    - name: Publish to npm
      env:
        VERSION: ${{ needs.release.outputs.version }}
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        NPM_TAG: ${{ needs.release.outputs.npm_tag }}
        NPM_CONFIG_LOGLEVEL: verbose
        NPM_CONFIG_LOGS_DIR: ${{ runner.temp }}/npm-publish-logs
        NPM_CONFIG_LOGS_MAX: '100'
      run: "set -euo pipefail\nprefix=\"\"\nif [[ -n \"${NPM_TAG}\" ]]; then\n  prefix=\"\
        ${NPM_TAG}-\"\nfi\n\nroot_tarball=\"dist/npm/zaino-npm-${VERSION}.tgz\"\n\
        sdk_tarball=\"dist/npm/codex-sdk-npm-${VERSION}.tgz\"\n# Keep this list in\
        \ sync with ZAINO_PLATFORM_PACKAGES in\n# codex-cli/scripts/build_npm_package.py.\
        \ The root wrapper advances\n# @zaino/cli@latest as soon as it publishes,\
        \ so every platform\n# package it aliases must already exist in the registry\
        \ first.\nplatform_tarballs=(\n  \"dist/npm/zaino-npm-linux-x64-${VERSION}.tgz\"\
        \n  \"dist/npm/zaino-npm-linux-arm64-${VERSION}.tgz\"\n  \"dist/npm/zaino-npm-darwin-x64-${VERSION}.tgz\"\
        \n  \"dist/npm/zaino-npm-darwin-arm64-${VERSION}.tgz\"\n  \"dist/npm/zaino-npm-win32-x64-${VERSION}.tgz\"\
        \n  \"dist/npm/zaino-npm-win32-arm64-${VERSION}.tgz\"\n)\n\n# A platform the\
        \ build did not produce has no tarball. That is not\n# fatal: its optionalDependency\
        \ simply resolves to nothing and npm\n# installs the matching platform package\
        \ on the platforms that exist.\n# The root tarball, however, must be present.\n\
        if [[ ! -f \"${root_tarball}\" ]]; then\n  echo \"Missing root npm tarball:\
        \ ${root_tarball}\"\n  exit 1\nfi\nfor platform_tarball in \"${platform_tarballs[@]}\"\
        ; do\n  if [[ ! -f \"${platform_tarball}\" ]]; then\n    echo \"::warning\
        \ title=Platform not built::${platform_tarball##*/} is absent; skipping that\
        \ platform's publish\"\n  fi\ndone\n\nshopt -s nullglob\nother_tarballs=()\n\
        for tarball in dist/npm/*-\"${VERSION}\".tgz; do\n  if [[ \"${tarball}\" ==\
        \ \"${root_tarball}\" || \"${tarball}\" == \"${sdk_tarball}\" ]]; then\n \
        \   continue\n  fi\n\n  is_platform_tarball=false\n  for platform_tarball\
        \ in \"${platform_tarballs[@]}\"; do\n    if [[ \"${tarball}\" == \"${platform_tarball}\"\
        \ ]]; then\n      is_platform_tarball=true\n      break\n    fi\n  done\n\
        \  if [[ \"${is_platform_tarball}\" == true ]]; then\n    continue\n  fi\n\
        \n  other_tarballs+=(\"${tarball}\")\ndone\n\n# npm returns HTTP 409 when\
        \ concurrent publishes update the same\n# packument. Every platform tarball\
        \ is a version of @zaino/cli,\n# so publish all tarballs serially.\ntarballs=(\n\
        \  \"${platform_tarballs[@]}\"\n  \"${other_tarballs[@]}\"\n  \"${root_tarball}\"\
        \n)\n# The SDK depends on this exact root package version.\nif [[ -f \"${sdk_tarball}\"\
        \ ]]; then\n  tarballs+=(\"${sdk_tarball}\")\nfi\n\nfor tarball in \"${tarballs[@]}\"\
        ; do\n  filename=\"$(basename \"${tarball}\")\"\n  tag=\"\"\n\n  case \"${filename}\"\
        \ in\n    zaino-npm-linux-*-\"${VERSION}\".tgz|zaino-npm-darwin-*-\"${VERSION}\"\
        .tgz|zaino-npm-win32-*-\"${VERSION}\".tgz)\n      platform=\"${filename#zaino-npm-}\"\
        \n      platform=\"${platform%-${VERSION}.tgz}\"\n      tag=\"${prefix}${platform}\"\
        \n      ;;\n    zaino-npm-\"${VERSION}\".tgz|codex-responses-api-proxy-npm-\"\
        ${VERSION}\".tgz|codex-sdk-npm-\"${VERSION}\".tgz)\n      tag=\"${NPM_TAG}\"\
        \n      ;;\n    *)\n      echo \"Unexpected npm tarball: ${filename}\"\n \
        \     exit 1\n      ;;\n  esac\n\n  # The publication workflow holds the lock\
        \ from this lookup through\n  # publish, including concurrent releases from\
        \ other version lines.\n  tag=\"$(python3 .github/scripts/npm_alpha_tag.py\
        \ \"${tarball}\" \"${VERSION}\" \"${tag:-latest}\")\"\n\n  publish_cmd=(npm\
        \ publish \"${GITHUB_WORKSPACE}/${tarball}\")\n  if [[ -n \"${tag}\" ]]; then\n\
        \    publish_cmd+=(--tag \"${tag}\")\n  fi\n\n  # A fresh npm process re-reads\
        \ the token on each attempt.\n  for attempt in 1 2 3; do\n    echo \"+ ${publish_cmd[*]}\
        \ (attempt ${attempt}/3)\"\n    set +e\n    publish_output=\"$(\"${publish_cmd[@]}\"\
        \ 2>&1)\"\n    publish_status=$?\n    set -e\n\n    echo \"${publish_output}\"\
        \n    if [[ ${publish_status} -eq 0 ]]; then\n      break\n    fi\n\n    if\
        \ grep -qiE \"previously published|cannot publish over|version already exists\"\
        \ <<< \"${publish_output}\"; then\n      echo \"Skipping already-published\
        \ package version for ${filename}\"\n      break\n    fi\n\n    if [[ ${attempt}\
        \ -eq 3 ]]; then\n      exit \"${publish_status}\"\n    fi\n    delay=$((attempt\
        \ * 10))\n    echo \"Publishing ${filename} failed; retrying in ${delay} seconds.\"\
        \n    sleep \"${delay}\"\n  done\ndone\n"
    - name: Retain npm debug logs
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: npm-publish-logs-${{ github.run_attempt }}
        path: ${{ runner.temp }}/npm-publish-logs/
        if-no-files-found: ignore
        retention-days: 7
  deploy-dev-website:
    name: Trigger developers site deploy
    needs:
    - release
    if: false
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: {}
    environment:
      name: dev-website-vercel-deploy
    steps:
    - name: Trigger developers.openai.com deploy
      continue-on-error: true
      env:
        DEV_WEBSITE_VERCEL_DEPLOY_HOOK_URL: ${{ secrets.DEV_WEBSITE_VERCEL_DEPLOY_HOOK_URL
          }}
      run: "if ! curl -sS -f -o /dev/null -X POST \"$DEV_WEBSITE_VERCEL_DEPLOY_HOOK_URL\"\
        ; then\n  echo \"::warning title=developers.openai.com deploy hook failed::Vercel\
        \ deploy hook POST failed for ${GITHUB_REF_NAME}\"\n  exit 1\nfi\n"
  winget:
    concurrency:
      group: rust-release
      cancel-in-progress: false
    name: winget
    needs:
    - release
    if: "${{\n  !cancelled() &&\n  needs.release.result == 'success' &&\n  !contains(needs.release.outputs.version,\
      \ '-')\n}}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: mainline-release-winget
    steps:
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624
      with:
        version: 1.23.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Install komac
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: cargo-binstall komac --version 2.16.0 --no-confirm
    - name: Publish to WinGet
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_TOKEN: ${{ secrets.WINGET_PUBLISH_PAT }}
        RELEASE_VERSION: ${{ needs.release.outputs.version }}
        RELEASE_TAG: ${{ needs.release.outputs.tag }}
        KOMAC_FORK_OWNER: openai-oss-forks
        KOMAC_CREATED_WITH: Zaino release workflow
        KOMAC_CREATED_WITH_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
      run: "set -euo pipefail\ninstaller_urls=\"$(gh release view \"$RELEASE_TAG\"\
        \ --repo \"$GITHUB_REPOSITORY\" \\\n  --json assets \\\n  --jq '.assets[]\
        \ | select(.name | test(\"^zaino-(x86_64|aarch64)-pc-windows-msvc\\\\.exe\\\
        \\.zip$\")) | .url')\"\nmapfile -t urls <<< \"$installer_urls\"\nif [[ ${#urls[@]}\
        \ -ne 2 ]]; then\n  echo \"::error::Expected x86_64 and aarch64 Windows archives\
        \ for $RELEASE_TAG\"\n  exit 1\nfi\nkomac sync-fork\nkomac update Zaino.Zaino\
        \ --version \"$RELEASE_VERSION\" --submit --urls \"${urls[@]}\"\nkomac cleanup\
        \ --only-merged\n"
  update-branch:
    concurrency:
      group: rust-release
      cancel-in-progress: false
    name: Update latest-alpha-cli branch
    if: "${{\n  !cancelled() &&\n  needs.release.result == 'success' &&\n  needs.release.outputs.npm_tag\
      \ == 'alpha' &&\n  needs.publish-r2.result == 'success' &&\n  needs.publish-npm.result\
      \ == 'success'\n}}"
    permissions:
      contents: write
    needs:
    - release
    - publish-r2
    - publish-npm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Determine whether to update the GitHub canary branch
      id: github_canary
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_VERSION: ${{ needs.release.outputs.version }}
        PYTHONPATH: .github/scripts
      run: "set -euo pipefail\n# Despite its name, raw+json returns raw TOML. The\
        \ default response\n# is JSON metadata with the file contents encoded as base64.\n\
        update=\"$(gh api \"repos/$GITHUB_REPOSITORY/contents/codex-rs/Cargo.toml?ref=latest-alpha-cli\"\
        \ \\\n  -H 'Accept: application/vnd.github.raw+json' \\\n  | python3 .github/scripts/releases.py\
        \ \"$RELEASE_VERSION\" --check-github canary)\"\necho \"update=$update\" >>\
        \ \"$GITHUB_OUTPUT\"\n"
    - name: Update latest-alpha-cli branch
      if: success() && steps.github_canary.outputs.update == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\ngh api \\\n  repos/${GITHUB_REPOSITORY}/git/refs/heads/latest-alpha-cli\
        \ \\\n  -X PATCH \\\n  -f sha=\"${GITHUB_SHA}\" \\\n  -F force=true\n"
