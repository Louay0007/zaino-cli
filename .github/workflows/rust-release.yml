      env:
        TARGET: ${{ matrix.target }}
        BINARIES: ${{ matrix.binaries }}
        APPLE_NOTARIZATION_AKV_KEY_NAME: ${{ secrets.AKV_NOTARIZATION_KEY_NAME }}
        APPLE_NOTARIZATION_AKV_KEY_VERSION: ${{ secrets.AKV_NOTARIZATION_KEY_VERSION
          }}
      run: "set -euo pipefail\n\ninput_dir=\"${RUNNER_TEMP}/unsigned-macos\"\noutput_dir=\"\
        ${GITHUB_WORKSPACE}/signed-macos/${TARGET}\"\nreport_dir=\"${GITHUB_WORKSPACE}/macos-binary-signing-verification/${TARGET}\"\
        \nmkdir -p \"$output_dir\" \"$report_dir\"\n\nfor binary in ${BINARIES}; do\n\
        \  unsigned_path=\"${input_dir}/${binary}-${TARGET}-unsigned.zst\"\n  signed_path=\"\
        ${output_dir}/${binary}\"\n  if [[ ! -f \"$unsigned_path\" ]]; then\n    echo\
        \ \"Unsigned binary $unsigned_path not found\"\n    exit 1\n  fi\n\n  zstd\
        \ -d --stdout \"$unsigned_path\" >\"$signed_path\"\n  chmod 0755 \"$signed_path\"\
        \n\n  entitlements=\"${GITHUB_WORKSPACE}/.github/scripts/macos-signing/${binary}.entitlements.plist\"\
        \n  if [[ ! -f \"$entitlements\" ]]; then\n    echo \"Entitlements file $entitlements\
        \ not found\"\n    exit 1\n  fi\n\n  .github/scripts/macos-signing/sign_macos_code.sh\
        \ \\\n    --target \"$signed_path\" \\\n    --identity unused \\\n    --deep\
        \ false \\\n    --identifier \"$binary\" \\\n    --options runtime \\\n  \
        \  --timestamp true \\\n    --entitlements \"$entitlements\"\n\n  mkdir -p\
        \ \"${report_dir}/${binary}\"\n  rcodesign print-signature-info \"$signed_path\"\
        \ \\\n    >\"${report_dir}/${binary}/signature-info.yaml\"\n\n  .github/scripts/macos-signing/notarize_macos_binary_with_akv.sh\
        \ \\\n    --binary \"$signed_path\" \\\n    --report-dir \"${report_dir}/${binary}\"\
        \ndone\n"
    - name: Fetch, sign, and notarize pinned macOS helpers
      if: ${{ matrix.bundle == 'primary' && vars.ZAINO_MACOS_SIGNING == 'true' }}
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
        APPLE_NOTARIZATION_AKV_KEY_NAME: ${{ secrets.AKV_NOTARIZATION_KEY_NAME }}
