      run: "set -euo pipefail\n\nsigned_root=\"${GITHUB_WORKSPACE}/signed-resources/${TARGET}\"\
        \nmkdir -p \"$signed_root\"\n\nPYTHONPATH=\"${GITHUB_WORKSPACE}/scripts\"\
        \ python3 - \"$TARGET\" \"$signed_root\" <<'PY'\nimport shutil\nimport sys\n\
        from pathlib import Path\n\nfrom codex_package.ripgrep import fetch_rg\nfrom\
        \ codex_package.targets import TARGET_SPECS\n\nspec = TARGET_SPECS[sys.argv[1]]\n\
        signed_root = Path(sys.argv[2])\nshutil.copy2(fetch_rg(spec), signed_root\
        \ / \"rg\")\nPY\n\nfor resource in rg; do\n  binary=\"${signed_root}/${resource}\"\
        \n  report_dir=\"${GITHUB_WORKSPACE}/macos-binary-signing-verification/${TARGET}/${resource}\"\
        \n  mkdir -p \"$report_dir\"\n  chmod 0755 \"$binary\"\n  .github/scripts/macos-signing/sign_macos_code.sh\
        \ \\\n    --target \"$binary\" \\\n    --identity unused \\\n    --deep false\
        \ \\\n    --identifier \"com.zaino.cli.${resource}\" \\\n    --options runtime\
        \ \\\n    --timestamp true\n\n  rcodesign print-signature-info \"$binary\"\
        \ \\\n    >\"${report_dir}/signature-info.yaml\"\n\n  .github/scripts/macos-signing/notarize_macos_binary_with_akv.sh\
        \ \\\n    --binary \"$binary\" \\\n    --report-dir \"$report_dir\"\ndone\n"
    - name: Sign and notarize voice runtime
      if: 'false'
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
        APPLE_NOTARIZATION_AKV_KEY_NAME: ${{ secrets.AKV_NOTARIZATION_KEY_NAME }}
        APPLE_NOTARIZATION_AKV_KEY_VERSION: ${{ secrets.AKV_NOTARIZATION_KEY_VERSION
          }}
      run: "set -euo pipefail\nunsigned=\"${RUNNER_TEMP}/unsigned-voice/extracted\"\
        \nsigned=\"${GITHUB_WORKSPACE}/signed-voice/${TARGET}\"\nmkdir -p \"$unsigned\"\
        \ \"$signed\"\ntar -xzf \"${RUNNER_TEMP}/unsigned-voice/voice-unsigned-${TARGET}.tar.gz\"\
        \ -C \"$unsigned\"\npython3 third_party/voice/release_runtime.py stage \\\n\
        \  --target \"$TARGET\" --source \"$unsigned/runtime\" --output \"$signed/runtime\"\
        \ncp \"$unsigned/codex-voice-host\" \"$signed/codex-voice-host\"\nchmod 0755\
        \ \"$signed/codex-voice-host\"\n\nwhile IFS= read -r -d '' library; do\n \
        \ name=\"$(basename \"$library\")\"\n  .github/scripts/macos-signing/sign_macos_code.sh\
        \ \\\n    --target \"$library\" --identity unused --deep false \\\n    --identifier\
        \ \"com.zaino.cli.voice.${name}\" \\\n    --options runtime --timestamp true\n\
        done < <(find \"$signed/runtime\" -name '*.dylib' -type f -print0)\n.github/scripts/macos-signing/sign_macos_code.sh\
        \ \\\n  --target \"$signed/codex-voice-host\" --identity unused --deep false\
        \ \\\n  --identifier com.zaino.cli.voice-host --options runtime --timestamp\
        \ true \\\n  --entitlements .github/scripts/macos-signing/codex-voice-host.entitlements.plist\n\
        \n# Notarize the actual signed closure together, then hash those bytes.\n\
        (cd \"$signed\" && zip -qr \"${RUNNER_TEMP}/voice-${TARGET}.zip\" runtime\
        \ codex-voice-host)\nreport_dir=\"${GITHUB_WORKSPACE}/macos-binary-signing-verification/${TARGET}/voice\"\
        \nmkdir -p \"$report_dir\"\npython3 .github/scripts/macos-signing/notarize_with_akv.py\
        \ \\\n  --file \"${RUNNER_TEMP}/voice-${TARGET}.zip\" \\\n  --report-log \"\
        ${report_dir}/notarization.json\" \\\n  --max-wait-seconds 600\npython3 third_party/voice/release_runtime.py\
        \ seal \\\n  --target \"$TARGET\" --output \"$signed/runtime\"\ntar -C \"\
        $signed\" -czf \"${GITHUB_WORKSPACE}/signed-voice-${TARGET}.tar.gz\" \\\n\
        \  runtime codex-voice-host\n"
    - name: Upload signed voice runtime
      if: 'false'
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: voice-${{ matrix.target }}-signed${{ env.ARTIFACT_SUFFIX }}
        path: signed-voice-${{ matrix.target }}.tar.gz
        if-no-files-found: error
    - name: Stage unsigned macOS binaries as the signed artifact
      if: ${{ vars.ZAINO_MACOS_SIGNING != 'true' }}
      shell: bash
      run: "set -euo pipefail\ndest=\"signed-macos/${TARGET}\"\nmkdir -p \"$dest\"\
        \n# The build job uploads its binaries as an archive; this job downloads and\n\
        # extracts them under $RUNNER_TEMP, so stage from there. Without signing there\n\
        # is nothing else to copy.\nsrc=\"${RUNNER_TEMP}/unsigned-macos\"\nfind \"\
        $src\" -maxdepth 3 -type f | head -20\nfor binary in ${BINARIES}; do\n  found=\"\
        $(find \"$src\" -type f -name \"${binary}*\" | head -1)\"\n  if [[ -n \"${found}\"\
        \ ]]; then\n    cp \"$found\" \"${dest}/${binary}\"\n    chmod 0755 \"${dest}/${binary}\"\
        \n  else\n    echo \"missing ${binary} under ${src}\" >&2\n  fi\ndone\nls\
        \ -la \"$dest\"\n"
      env:
        TARGET: ${{ matrix.target }}
        BINARIES: ${{ matrix.binaries }}
    - name: Fetch macOS helpers without signing
      if: ${{ matrix.bundle == 'primary' && vars.ZAINO_MACOS_SIGNING != 'true' }}
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: 'set -euo pipefail

        signed_root="${GITHUB_WORKSPACE}/signed-resources/${TARGET}"

        mkdir -p "$signed_root"

        PYTHONPATH="${GITHUB_WORKSPACE}/scripts" python3 - "$TARGET" "$signed_root"
        <<''PY''

        import shutil

        import sys

        from pathlib import Path


        from codex_package.ripgrep import fetch_rg

        from codex_package.targets import TARGET_SPECS


        spec = TARGET_SPECS[sys.argv[1]]

        signed_root = Path(sys.argv[2])

        shutil.copy2(fetch_rg(spec), signed_root / "rg")

        PY

        chmod -R 0755 "$signed_root"

        '
    - name: Upload signed macOS binaries
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ matrix.artifact_name }}-signed-binaries${{ env.ARTIFACT_SUFFIX }}
        path: signed-macos/${{ matrix.target }}/*
        if-no-files-found: error
    - name: Upload signed macOS helpers
      if: ${{ matrix.bundle == 'primary' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ matrix.target }}-signed-resources${{ env.ARTIFACT_SUFFIX }}
        path: signed-resources/${{ matrix.target }}/*
        if-no-files-found: error
    - name: Upload binary signing verification
      if: ${{ always() }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ matrix.artifact_name }}-binary-signing-verification${{ env.ARTIFACT_SUFFIX
          }}
        path: macos-binary-signing-verification/${{ matrix.target }}/
        if-no-files-found: warn
  package-macos:
    needs: sign-macos-binaries
    name: Package macOS artifacts - ${{ matrix.target }} - ${{ matrix.bundle }} - ${{ matrix.build-system }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      ARTIFACT_SUFFIX: ${{ matrix.build-system == 'bazel' && '-bazel' || '' }}
    strategy:
      fail-fast: false
      matrix:
        build-system:
        - cargo
        target:
        - aarch64-apple-darwin
        - x86_64-apple-darwin
        bundle:
        - primary
        include:
        - target: aarch64-apple-darwin
          bundle: primary
          artifact_name: aarch64-apple-darwin
          binaries: zaino codex-code-mode-host codex-exec-server codex-responses-api-proxy
          build_dmg: 'true'
        - target: x86_64-apple-darwin
          bundle: primary
          artifact_name: x86_64-apple-darwin
          binaries: zaino codex-code-mode-host codex-exec-server codex-responses-api-proxy
          build_dmg: 'true'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Download signed macOS binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.artifact_name }}-signed-binaries${{ env.ARTIFACT_SUFFIX }}
        path: codex-rs/target/${{ matrix.target }}/release
    - name: Download signed macOS helpers
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.target }}-signed-resources${{ env.ARTIFACT_SUFFIX }}
        path: codex-rs/signed-resources/${{ matrix.target }}
    - name: Download signed voice runtime
      if: 'false'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: voice-${{ matrix.target }}-signed${{ env.ARTIFACT_SUFFIX }}
        path: ${{ runner.temp }}/signed-voice
    - name: Verify signed voice runtime
      if: 'false'
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: "set -euo pipefail\nroot=\"${RUNNER_TEMP}/signed-voice/${TARGET}\"\nmkdir\
        \ -p \"$root\"\ntar -xzf \"${RUNNER_TEMP}/signed-voice/signed-voice-${TARGET}.tar.gz\"\
        \ -C \"$root\"\ncase \"$TARGET\" in\n  aarch64-apple-darwin) arch=arm64 ;;\n\
        \  x86_64-apple-darwin) arch=x86_64 ;;\n  *) exit 1 ;;\nesac\nPYTHONPATH=\"\
        ${GITHUB_WORKSPACE}/third_party/voice\" python3 - \"$root/runtime\" \"$TARGET\"\
        \ <<'PY'\nfrom pathlib import Path\nimport sys\nfrom package_runtime import\
        \ runtime_files\nruntime_files(Path(sys.argv[1]).resolve(strict=True), sys.argv[2],\
        \ public_release=True)\nPY\nwhile IFS= read -r -d '' binary; do\n  lipo \"\
        $binary\" -verify_arch \"$arch\"\n  codesign --verify --strict --verbose=2\
        \ \"$binary\"\ndone < <(find \"$root/runtime\" -name '*.dylib' -type f -print0)\n\
        lipo \"$root/codex-voice-host\" -verify_arch \"$arch\"\ncodesign --verify\
        \ --strict --verbose=2 \"$root/codex-voice-host\"\n"
    - name: Verify signed macOS binaries
      shell: bash
      run: "set -euo pipefail\nfor binary in ${{ matrix.binaries }}; do\n  binary_path=\"\
        target/${{ matrix.target }}/release/${binary}\"\n  chmod 0755 \"$binary_path\"\
        \n  codesign --verify --strict --verbose=2 \"$binary_path\"\ndone\n\nfor resource\
        \ in rg; do\n  resource_path=\"signed-resources/${{ matrix.target }}/${resource}\"\
        \n  chmod 0755 \"$resource_path\"\n  codesign --verify --strict --verbose=2\
        \ \"$resource_path\"\ndone\n"
    - name: Stage macOS artifacts
      shell: bash
      run: "set -euo pipefail\ndest=\"dist/${{ matrix.target }}\"\nmkdir -p \"$dest\"\
        \n\nfor binary in ${{ matrix.binaries }}; do\n  # Both variants package the\
        \ host and executor; only the primary publishes\n  # standalone binary archives\
        \ to avoid duplicate release asset names.\n  if [[ \"${{ matrix.bundle }}\"\
        \ == \"app-server\" && ( \"$binary\" == \"codex-code-mode-host\" || \"$binary\"\
        \ == \"codex-exec-server\" ) ]]; then\n    continue\n  fi\n  cp \"target/${{\
        \ matrix.target }}/release/${binary}\" \"$dest/${binary}-${{ matrix.target\
        \ }}\"\ndone\n"
    - name: Build Codex package archive
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
        BUNDLE: ${{ matrix.bundle }}
      run: "set -euo pipefail\nvoice_args=()\n# The voice runtime is optional: only\
        \ pass it when it actually built.\nif [[ \"$BUNDLE\" == \"primary\" && -d\
        \ \"${RUNNER_TEMP}/signed-voice/${TARGET}\" ]]; then\n  voice_args+=(--voice-release-dir\
        \ \"${RUNNER_TEMP}/signed-voice/${TARGET}\")\n  voice_args+=(--release-version\
        \ \"${GITHUB_REF_NAME#rust-v}\")\nfi\nbash \"${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh\"\
        \ \\\n  --target \"$TARGET\" \\\n  --bundle \"$BUNDLE\" \\\n  --entrypoint-dir\
        \ \"target/${TARGET}/release\" \\\n  --archive-dir \"dist/${TARGET}\" \\\n\
        \  --rg-bin \"signed-resources/${TARGET}/rg\" \\\n  ${voice_args[@]+\"${voice_args[@]}\"\
        }\n"
    - name: Build unsigned macOS DMG
      if: ${{ matrix.build_dmg == 'true' }}
      shell: bash
      run: "set -euo pipefail\n\ntarget=\"${{ matrix.target }}\"\nrelease_dir=\"target/${target}/release\"\
        \ndmg_root=\"${RUNNER_TEMP}/codex-dmg-root-${target}\"\nvolname=\"Zaino (${target})\"\
        \ndmg_path=\"${release_dir}/zaino-${target}.dmg\"\n\nrm -rf \"$dmg_root\"\n\
        mkdir -p \"$dmg_root\"\n\nfor binary in ${{ matrix.binaries }}; do\n  binary_path=\"\
        ${release_dir}/${binary}\"\n  if [[ ! -f \"$binary_path\" ]]; then\n    echo\
        \ \"Binary $binary_path not found\"\n    exit 1\n  fi\n  ditto \"$binary_path\"\
        \ \"${dmg_root}/${binary}\"\ndone\n\nif [[ \"${{ matrix.bundle }}\" == \"\
        primary\" ]]; then\n  # Keep the root-level invocation, but resolve it into\
        \ the canonical\n  # package layout so InstallContext finds its adjacent voice\
        \ runtime.\n  package=\"${RUNNER_TEMP}/codex-package-voice-${target}\"\n \
        \ ditto \"$package\" \"$dmg_root\"\n  rm \"${dmg_root}/zaino\"\n  ln -s bin/zaino\
        \ \"${dmg_root}/zaino\"\nfi\n\nrm -f \"$dmg_path\"\nhdiutil create \\\n  -volname\
        \ \"$volname\" \\\n  -srcfolder \"$dmg_root\" \\\n  -format UDZO \\\n  -ov\
        \ \\\n  \"$dmg_path\"\n\nif [[ ! -f \"$dmg_path\" ]]; then\n  echo \"DMG $dmg_path\
        \ not found after build\"\n  exit 1\nfi\n"
    - name: Upload unsigned macOS DMG
      if: ${{ matrix.build_dmg == 'true' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ matrix.artifact_name }}-unsigned-dmg${{ env.ARTIFACT_SUFFIX }}
        path: codex-rs/target/${{ matrix.target }}/release/zaino-${{ matrix.target
          }}.dmg
        if-no-files-found: error
    - name: Set up Python release tools
      if: ${{ matrix.build-system == 'cargo' && matrix.bundle == 'primary' }}
      uses: ./.github/actions/setup-python-release-tools
      with:
        group: runtime
    - name: Build Python runtime wheel
      if: ${{ matrix.build-system == 'cargo' && matrix.bundle == 'primary' }}
      shell: bash
      run: "set -euo pipefail\n\ncase \"${{ matrix.target }}\" in\n  aarch64-apple-darwin)\n\
        \    platform_tag=\"macosx_11_0_arm64\"\n    ;;\n  x86_64-apple-darwin)\n\
        \    platform_tag=\"macosx_10_9_x86_64\"\n    ;;\n  *)\n    echo \"No Python\
        \ runtime wheel platform tag for ${{ matrix.target }}\"\n    exit 1\n    ;;\n\
        esac\n\n# The wheel keeps its macOS 10.9/11 tags. The native voice build\n\
        # currently targets macOS 14, so keep it in the release archives and\n# DMG\
        \ but leave this older-OS-compatible wheel unchanged.\nwheel_archives=\"${RUNNER_TEMP}/voice-free-wheel/${{\
        \ matrix.target }}\"\nbash \"${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh\"\
        \ \\\n  --target \"${{ matrix.target }}\" \\\n  --bundle primary \\\n  --entrypoint-dir\
        \ \"target/${{ matrix.target }}/release\" \\\n  --archive-dir \"$wheel_archives\"\
        \ \\\n  --rg-bin \"signed-resources/${{ matrix.target }}/rg\"\nwheel_archive=\"\
        ${wheel_archives}/codex-package-${{ matrix.target }}.tar.gz\"\npython3 - \"\
        $wheel_archive\" <<'PY'\nimport sys\nimport tarfile\nwith tarfile.open(sys.argv[1])\
        \ as archive:\n    assert not any(\"codex-resources/voice/\" in item.name\
        \ for item in archive)\nPY\n\nstage_dir=\"${RUNNER_TEMP}/zaino-cli-bin-${{\
        \ matrix.target }}\"\nwheel_dir=\"${GITHUB_WORKSPACE}/python-runtime-dist/${{\
        \ matrix.target }}\"\npython3 \\\n  \"${GITHUB_WORKSPACE}/sdk/python/scripts/update_sdk_artifacts.py\"\
        \ \\\n  stage-runtime \\\n  \"$stage_dir\" \\\n  \"$wheel_archive\" \\\n \
        \ --codex-version \"${GITHUB_REF_NAME}\" \\\n  --platform-tag \"$platform_tag\"\
        \nuv build --offline --no-build-isolation --no-create-gitignore \\\n  --python\
        \ \"${RUNNER_TEMP}/python-runtime-build-venv\" --wheel --out-dir \"$wheel_dir\"\
        \ \"$stage_dir\"\n"
    - name: Upload Python runtime wheel
      if: ${{ matrix.build-system == 'cargo' && matrix.bundle == 'primary' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: python-runtime-wheel-${{ matrix.target }}
        path: python-runtime-dist/${{ matrix.target }}/*.whl
        if-no-files-found: error
    - name: Compress artifacts
      shell: bash
      run: "set -euo pipefail\ndest=\"dist/${{ matrix.target }}\"\nfor f in \"$dest\"\
        /*; do\n  base=\"$(basename \"$f\")\"\n  if [[ \"$base\" == *.tar.gz || \"\
        $base\" == *.tar.zst || \"$base\" == *.zip || \"$base\" == *.dmg ]]; then\n\
        \    continue\n  fi\n\n  tar -C \"$dest\" -czf \"$dest/${base}.tar.gz\" \"\
        $base\"\n  zstd -T0 -19 --rm \"$dest/$base\"\ndone\n"
    - name: Upload packaged macOS artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ matrix.artifact_name }}-packaged${{ env.ARTIFACT_SUFFIX }}
        path: codex-rs/dist/${{ matrix.target }}/*
        if-no-files-found: error
