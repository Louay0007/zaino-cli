name: probeB1
on:
  push:
    tags:
    - rust-v*.*.*
jobs:
  tag-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
    - name: Validate tag matches Cargo.toml version
      shell: bash
      run: "set -euo pipefail\necho \"::group::Tag validation\"\n\n# Release runs\
        \ must come from a tag.\n[[ \"${GITHUB_REF_TYPE}\" == \"tag\" ]] \\\n  ||\
        \ { echo \"\u274C  Not a tag ref\"; exit 1; }\n\ntag_ver=\"${GITHUB_REF_NAME#rust-v}\"\
        \n[[ \"${GITHUB_REF_NAME}\" == rust-v* ]] \\\n  && python3 .github/scripts/releases.py\
        \ \"${tag_ver}\" \\\n  || { echo \"\u274C  Tag '${GITHUB_REF_NAME}' doesn't\
        \ match expected format\"; exit 1; }\n\n# Release tags must match the version\
        \ in Cargo.toml.\ncargo_ver=\"$(grep -m1 '^version' codex-rs/Cargo.toml \\\
        \n              | sed -E 's/version *= *\"([^\"]+)\".*/\\1/')\"\n\n[[ \"${tag_ver}\"\
        \ == \"${cargo_ver}\" ]] \\\n  || { echo \"\u274C  Tag ${tag_ver} \u2260 Cargo.toml\
        \ ${cargo_ver}\"; exit 1; }\n\necho \"\u2705  Tag and Cargo.toml agree (${tag_ver})\"\
        \necho \"::endgroup::\"\n"
  build:
    name: Build - ${{ matrix.runner }} - ${{ matrix.target }} - ${{ matrix.bundle
      }} - ${{ matrix.build-system }}
    runs-on: ${{ matrix.runner }}
    environment:
      name: bazel
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: codex-rs
    env:
      ARTIFACT_SUFFIX: ${{ matrix.build-system == 'bazel' && '-bazel' || '' }}
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple-darwin')
        && 'packed' || 'off' }}
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    strategy:
      fail-fast: false
      matrix:
        build-system:
        - cargo
        target:
        - aarch64-apple-darwin
        - x86_64-apple-darwin
        - x86_64-unknown-linux-musl
        - aarch64-unknown-linux-musl
        bundle:
        - primary
        - app-server
        include:
        - runner: macos-15-xlarge
          target: aarch64-apple-darwin
          bundle: primary
          artifact_name: aarch64-apple-darwin
          binaries: zaino codex-code-mode-host codex-exec-server codex-responses-api-proxy
          build_dmg: 'true'
        - runner: macos-15-xlarge
          target: aarch64-apple-darwin
          bundle: app-server
          artifact_name: aarch64-apple-darwin-app-server
          binaries: codex-app-server codex-code-mode-host codex-exec-server
          build_dmg: 'false'
        - runner: macos-15-xlarge
          target: x86_64-apple-darwin
          bundle: primary
          artifact_name: x86_64-apple-darwin
          binaries: zaino codex-code-mode-host codex-exec-server codex-responses-api-proxy
          build_dmg: 'true'
        - runner: macos-15-xlarge
          target: x86_64-apple-darwin
          bundle: app-server
          artifact_name: x86_64-apple-darwin-app-server
          binaries: codex-app-server codex-code-mode-host codex-exec-server
          build_dmg: 'false'
        - runner: ${{ github.event.repository.name }}-linux-x64-xl
          target: x86_64-unknown-linux-musl
          bundle: primary
          artifact_name: x86_64-unknown-linux-musl
          binaries: zaino codex-code-mode-host codex-exec-server codex-responses-api-proxy
            bwrap
          build_dmg: 'false'
        - runner: ${{ github.event.repository.name }}-linux-x64-xl
          target: x86_64-unknown-linux-musl
          bundle: app-server
          artifact_name: x86_64-unknown-linux-musl-app-server
          binaries: codex-app-server codex-code-mode-host codex-exec-server
          build_dmg: 'false'
        - runner: ${{ github.event.repository.name }}-linux-arm64
          target: aarch64-unknown-linux-musl
          bundle: primary
          artifact_name: aarch64-unknown-linux-musl
          binaries: zaino codex-code-mode-host codex-exec-server codex-responses-api-proxy
            bwrap
          build_dmg: 'false'
        - runner: ${{ github.event.repository.name }}-linux-arm64
          target: aarch64-unknown-linux-musl
          bundle: app-server
          artifact_name: aarch64-unknown-linux-musl-app-server
          binaries: codex-app-server codex-code-mode-host codex-exec-server
          build_dmg: 'false'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Print runner specs (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: 'set -euo pipefail

        cpu_model="$(lscpu | awk -F: ''/Model name/ {gsub(/^[ \t]+/, "", $2); print
        $2; exit}'')"

        total_ram="$(awk ''/MemTotal/ {printf "%.1f GiB\n", $2 / 1024 / 1024}'' /proc/meminfo)"

        echo "Runner: ${RUNNER_NAME:-unknown}"

        echo "OS: $(uname -a)"

        echo "CPU model: ${cpu_model}"

        echo "Logical CPUs: $(nproc)"

        echo "Total RAM: ${total_ram}"

        echo "Disk usage:"

        df -h .

        '
    - name: Print runner specs (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: 'set -euo pipefail

        total_ram="$(sysctl -n hw.memsize | awk ''{printf "%.1f GiB\n", $1 / 1024
        / 1024 / 1024}'')"

        echo "Runner: ${RUNNER_NAME:-unknown}"

        echo "OS: $(sw_vers -productName) $(sw_vers -productVersion)"

        echo "Hardware model: $(sysctl -n hw.model)"

        echo "CPU architecture: $(uname -m)"

        echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"

        echo "Physical CPUs: $(sysctl -n hw.physicalcpu)"

        echo "Total RAM: ${total_ram}"

        echo "Disk usage:"

        df -h .

        '
    - name: Install Linux bwrap build dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: 'set -euo pipefail

        sudo apt-get update -y

        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        binutils pkg-config libcap-dev

        '
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        targets: ${{ matrix.build-system == 'cargo' && matrix.target || '' }}
    - if: ${{ matrix.build-system == 'cargo' && contains(matrix.target, 'linux') }}
      name: Use hermetic Cargo home (musl)
      shell: bash
      run: 'set -euo pipefail

        cargo_home="${GITHUB_WORKSPACE}/.cargo-home"

        mkdir -p "${cargo_home}/bin"

        echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"

        echo "${cargo_home}/bin" >> "$GITHUB_PATH"

        : > "${cargo_home}/config.toml"

        '
    - if: ${{ matrix.build-system == 'cargo' && contains(matrix.target, 'linux') }}
      name: Install Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.14.0
        use-cache: false
    - if: ${{ matrix.build-system == 'cargo' && contains(matrix.target, 'linux') }}
      name: Install musl build tools
      env:
        TARGET: ${{ matrix.target }}
        CODEX_MUSL_RELEASE_LINK_FLAGS: '1'
      run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
    - if: ${{ matrix.build-system == 'cargo' && contains(matrix.target, 'linux') }}
      name: Disable aws-lc jitter entropy (musl)
      shell: bash
      run: 'set -euo pipefail

        # Avoid problematic aws-lc jitter entropy code path on musl builders.

        echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"

        target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"

        target_no_jitter="${target_no_jitter//-/_}"

        echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

        '
    - name: Configure rusty_v8 artifact overrides and verify checksums
      if: ${{ matrix.build-system == 'cargo' }}
      uses: ./.github/actions/setup-rusty-v8
      with:
        target: ${{ matrix.target }}
    - if: ${{ matrix.build-system == 'cargo' && contains(matrix.target, 'linux') }}
      name: Build bwrap and export digest
      shell: bash
      run: "set -euo pipefail\ntarget=\"${{ matrix.target }}\"\ncargo build --target\
        \ \"$target\" --release --timings --bin bwrap\n\nbwrap_path=\"target/${target}/release/bwrap\"\
        \nif [[ ! -f \"$bwrap_path\" ]]; then\n  echo \"bwrap binary ${bwrap_path}\
        \ not found\"\n  exit 1\nfi\n\n# Codex embeds this digest at build time and\
        \ verifies the bundled\n# bwrap resource before use. Strip bwrap before hashing\
        \ so the digest\n# covers the exact bytes that the release packages.\nstrip\
        \ --strip-debug --strip-unneeded \"$bwrap_path\"\ndigest=\"$(sha256sum \"\
        $bwrap_path\" | awk '{print $1}')\"\necho \"CODEX_BWRAP_SHA256=${digest}\"\
        \ >> \"$GITHUB_ENV\"\necho \"Built bwrap ${bwrap_path} with sha256:${digest}\"\
        \n"
    - name: Cargo build
      if: ${{ matrix.build-system == 'cargo' }}
      shell: bash
      run: "target=\"${{ matrix.target }}\"\nbuild_args=()\nfor binary in ${{ matrix.binaries\
        \ }}; do\n  # bwrap was built, finalized, and hashed before this build so\n\
        \  # Codex can embed the digest of the bytes that will be packaged.\n  if\
        \ [[ \"$binary\" == \"bwrap\" ]]; then\n    continue\n  fi\n  build_args+=(--bin\
        \ \"$binary\")\ndone\nSTABLE_GIT_COMMIT=\"$(git rev-parse HEAD)\"\nexport\
        \ STABLE_GIT_COMMIT\ncargo build --target \"$target\" --release --timings\
        \ \"${build_args[@]}\"\n"
    - name: Prepare Bazel for release binaries or Linux voice
      if: matrix.build-system == 'bazel' || (matrix.bundle == 'primary' && contains(matrix.target,
        'linux'))
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ matrix.target }}
        cache-scope: bazel-release-${{ matrix.bundle }}
    - name: Build Bazel release binaries and symbols
      if: ${{ matrix.build-system == 'bazel' }}
      uses: ./.github/actions/build-bazel-release
      with:
        target: ${{ matrix.target }}
        bundle: ${{ matrix.bundle }}
        release-dir: ${{ github.workspace }}/codex-rs/target/${{ matrix.target }}/release
    - name: Build symbols archive and strip binaries
      shell: bash
      run: "binaries=()\nfor binary in ${{ matrix.binaries }}; do\n  # bwrap is already\
        \ stripped before hashing. Its symbols are not\n  # useful enough to justify\
        \ a separate pre-Codex symbols pass.\n  if [[ \"$binary\" == \"bwrap\" ]];\
        \ then\n    continue\n  fi\n  binaries+=(\"$binary\")\ndone\nbash \"${GITHUB_WORKSPACE}/.github/scripts/archive-release-symbols-and-strip-binaries.sh\"\
        \ \\\n  --target \"${{ matrix.target }}\" \\\n  --artifact-name \"${{ matrix.artifact_name\
        \ }}\" \\\n  --release-dir \"target/${{ matrix.target }}/release\" \\\n  --archive-dir\
        \ \"symbols-dist/${{ matrix.artifact_name }}\" \\\n  --binaries \"${binaries[*]}\"\
        \n"
    - name: Suffix Bazel artifact filenames
      if: ${{ matrix.build-system == 'bazel' }}
      shell: bash
      run: "set -euo pipefail\nfor artifact in \"symbols-dist/${{ matrix.artifact_name\
        \ }}\"/*; do\n  name=\"${artifact##*/}\"\n  stem=\"${name%%.*}\"\n  mv \"\
        $artifact\" \"${artifact%/*}/${stem}-bazel${name#\"$stem\"}\"\ndone\n"
    - name: Upload symbols archive
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ matrix.artifact_name }}-symbols${{ env.ARTIFACT_SUFFIX }}
        path: codex-rs/symbols-dist/${{ matrix.artifact_name }}/*
        if-no-files-found: error
    - name: Build Linux voice runtime
      if: ${{ matrix.bundle == 'primary' && contains(matrix.target, 'linux') }}
      shell: bash
      env:
        APP_TARGET: ${{ matrix.target }}
      run: "set -euo pipefail\ncd \"$GITHUB_WORKSPACE\"\nvoice_target=\"${APP_TARGET%-musl}-gnu\"\
        \ncase \"$voice_target\" in\n  aarch64-unknown-linux-gnu) prefix=linux_aarch64\
        \ ;;\n  x86_64-unknown-linux-gnu) prefix=linux_x86_64 ;;\n  *) exit 1 ;;\n\
        esac\npython3 .github/scripts/run_bazel_with_buildbuddy.py build --config=release\
        \ \\\n  //codex-rs/voice-host:codex-voice-host //third_party/voice:native_runtime\n\
        source=\"bazel-bin/third_party/voice/native_runtime_${prefix}\"\noutput=\"\
        ${RUNNER_TEMP}/signed-voice/${APP_TARGET}\"\nmkdir -p \"$output\"\npython3\
        \ third_party/voice/release_runtime.py stage \\\n  --target \"$voice_target\"\
        \ --source \"$source\" --output \"$output/runtime\"\ncp bazel-bin/codex-rs/voice-host/codex-voice-host\
        \ \"$output/codex-voice-host\"\nchmod 0755 \"$output/codex-voice-host\"\n\
        python3 third_party/voice/release_runtime.py seal \\\n  --target \"$voice_target\"\
        \ --output \"$output/runtime\"\n"
    - if: ${{ runner.os == 'macOS' }}
      name: Stage unsigned macOS artifacts
      shell: bash
      run: "set -euo pipefail\n\ntarget=\"${{ matrix.target }}\"\nrelease_dir=\"target/${target}/release\"\
        \ndest=\"unsigned-dist/${target}\"\nmkdir -p \"$dest\"\n\nfor binary in ${{\
        \ matrix.binaries }}; do\n  binary_path=\"${release_dir}/${binary}\"\n  unsigned_name=\"\
        ${binary}-${target}-unsigned\"\n  unsigned_path=\"${dest}/${unsigned_name}\"\
        \n  if [[ ! -f \"${binary_path}\" ]]; then\n    echo \"Binary ${binary_path}\
        \ not found\"\n    exit 1\n  fi\n\n  cp \"${binary_path}\" \"${unsigned_path}\"\
        \n  tar -C \"$dest\" -czf \"${unsigned_path}.tar.gz\" \"${unsigned_name}\"\
        \n  zstd -T0 -19 --rm \"${unsigned_path}\"\ndone\n"
    - if: ${{ runner.os == 'macOS' }}
      name: Upload unsigned macOS artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ matrix.artifact_name }}-unsigned${{ env.ARTIFACT_SUFFIX }}
        path: codex-rs/unsigned-dist/${{ matrix.target }}/*
        if-no-files-found: error
    - if: ${{ contains(matrix.target, 'linux') }}
      name: Cosign Linux artifacts
      uses: ./.github/actions/linux-code-sign
      with:
        target: ${{ matrix.target }}
        artifacts-dir: ${{ github.workspace }}/codex-rs/target/${{ matrix.target }}/release
        binaries: ${{ matrix.binaries }}
    - name: Stage artifacts
      if: ${{ runner.os != 'macOS' }}
      shell: bash
      run: "dest=\"dist/${{ matrix.target }}\"\nmkdir -p \"$dest\"\n\nfor binary in\
        \ ${{ matrix.binaries }}; do\n  # Both variants package the host and executor;\
        \ only the primary publishes\n  # standalone binary archives to avoid duplicate\
        \ release asset names.\n  if [[ \"${{ matrix.bundle }}\" == \"app-server\"\
        \ && ( \"$binary\" == \"codex-code-mode-host\" || \"$binary\" == \"codex-exec-server\"\
        \ ) ]]; then\n    continue\n  fi\n  cp \"target/${{ matrix.target }}/release/${binary}\"\
        \ \"$dest/${binary}-${{ matrix.target }}\"\n  if [[ \"${{ matrix.target }}\"\
        \ == *linux* ]]; then\n    cp \"target/${{ matrix.target }}/release/${binary}.sigstore\"\
        \ \\\n      \"$dest/${binary}-${{ matrix.target }}.sigstore\"\n  fi\ndone\n\
        \nif [[ \"${{ matrix.build_dmg }}\" == \"true\" ]]; then\n  cp target/${{\
        \ matrix.target }}/release/zaino-${{ matrix.target }}.dmg \"$dest/zaino-${{\
        \ matrix.target }}.dmg\"\nfi\n"
    - name: Build Codex package archive
      if: ${{ runner.os != 'macOS' }}
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
        BUNDLE: ${{ matrix.bundle }}
      run: "set -euo pipefail\nvoice_args=()\nif [[ \"$BUNDLE\" == \"primary\" &&\
        \ \"$TARGET\" == *-unknown-linux-musl ]]; then\n  voice_args+=(--voice-release-dir\
        \ \"${RUNNER_TEMP}/signed-voice/${TARGET}\")\n  voice_args+=(--release-version\
        \ \"${GITHUB_REF_NAME#rust-v}\")\nfi\nbash \"${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh\"\
        \ \\\n  --target \"$TARGET\" \\\n  --bundle \"$BUNDLE\" \\\n  --entrypoint-dir\
        \ \"target/${TARGET}/release\" \\\n  --archive-dir \"dist/${TARGET}\" \\\n\
        \  \"${voice_args[@]}\"\n"
    - name: Cosign Linux voice package archives
      if: ${{ matrix.bundle == 'primary' && contains(matrix.target, 'linux') }}
      uses: ./.github/actions/linux-code-sign
      with:
        target: ${{ matrix.target }}
        artifacts-dir: ${{ github.workspace }}/codex-rs/dist/${{ matrix.target }}
        binaries: codex-package-${{ matrix.target }}.tar.gz codex-package-${{ matrix.target
          }}.tar.zst
    - name: Set up Python release tools
      if: ${{ matrix.build-system == 'cargo' && matrix.bundle == 'primary' && runner.os
        != 'macOS' }}
      uses: ./.github/actions/setup-python-release-tools
      with:
        group: runtime
    - name: Build Python runtime wheel
      if: ${{ matrix.build-system == 'cargo' && matrix.bundle == 'primary' && runner.os
        != 'macOS' }}
      shell: bash
      run: "set -euo pipefail\n\ncase \"${{ matrix.target }}\" in\n  aarch64-apple-darwin)\n\
        \    platform_tag=\"macosx_11_0_arm64\"\n    ;;\n  x86_64-apple-darwin)\n\
        \    platform_tag=\"macosx_10_9_x86_64\"\n    ;;\n  aarch64-unknown-linux-musl)\n\
        \    platform_tag=\"manylinux_2_17_aarch64\"\n    ;;\n  x86_64-unknown-linux-musl)\n\
        \    platform_tag=\"manylinux_2_17_x86_64\"\n    ;;\n  *)\n    echo \"No Python\
        \ runtime wheel platform tag for ${{ matrix.target }}\"\n    exit 1\n    ;;\n\
        esac\n\n# Keep the existing manylinux_2_17 wheel compatible with older glibc.\n\
        # GNU voice libraries belong in the signed release package archives,\n# but\
        \ their minimum glibc version is not covered by this wheel tag.\nwheel_archives=\"\
        ${RUNNER_TEMP}/voice-free-wheel/${{ matrix.target }}\"\nbash \"${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh\"\
        \ \\\n  --target \"${{ matrix.target }}\" \\\n  --bundle primary \\\n  --entrypoint-dir\
        \ \"target/${{ matrix.target }}/release\" \\\n  --archive-dir \"$wheel_archives\"\
        \nwheel_archive=\"${wheel_archives}/codex-package-${{ matrix.target }}.tar.gz\"\
        \npython3 - \"$wheel_archive\" <<'PY'\nimport sys\nimport tarfile\nwith tarfile.open(sys.argv[1])\
        \ as archive:\n    assert not any(\"codex-resources/voice/\" in item.name\
        \ for item in archive)\nPY\n\nstage_dir=\"${RUNNER_TEMP}/zaino-cli-bin-${{\
        \ matrix.target }}\"\nwheel_dir=\"${GITHUB_WORKSPACE}/python-runtime-dist/${{\
        \ matrix.target }}\"\nstage_runtime_args=(\n  \"${GITHUB_WORKSPACE}/sdk/python/scripts/update_sdk_artifacts.py\"\
        \n  stage-runtime\n  \"$stage_dir\"\n  \"$wheel_archive\"\n  --codex-version\
        \ \"${GITHUB_REF_NAME}\"\n  --platform-tag \"$platform_tag\"\n)\npython3 \"\
        ${stage_runtime_args[@]}\"\nuv build --offline --no-build-isolation --no-create-gitignore\
        \ \\\n  --python \"${RUNNER_TEMP}/python-runtime-build-venv\" --wheel --out-dir\
        \ \"$wheel_dir\" \"$stage_dir\"\n"
    - name: Upload Python runtime wheel
      if: ${{ matrix.build-system == 'cargo' && matrix.bundle == 'primary' && runner.os
        != 'macOS' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: python-runtime-wheel-${{ matrix.target }}
        path: python-runtime-dist/${{ matrix.target }}/*.whl
        if-no-files-found: error
    - name: Compress artifacts
      if: ${{ runner.os != 'macOS' }}
      shell: bash
      run: "# Path that contains the uncompressed binaries for the current\n# ${{\
        \ matrix.target }}\ndest=\"dist/${{ matrix.target }}\"\n\n# For compatibility\
        \ with environments that lack the `zstd` tool we\n# additionally create a\
        \ `.tar.gz` alongside every binary we publish.\n# The end result is:\n#  \
        \ codex-<target>.zst          (existing)\n#   codex-<target>.tar.gz      \
        \ (new)\n\n# 1. Produce a .tar.gz for every file in the directory *before*\
        \ we\n#    run `zstd --rm`, because that flag deletes the original files.\n\
        for f in \"$dest\"/*; do\n  base=\"$(basename \"$f\")\"\n  # Skip files that\
        \ are already archives (shouldn't happen, but be\n  # safe).\n  if [[ \"$base\"\
        \ == *.tar.gz || \"$base\" == *.tar.zst || \"$base\" == *.zip || \"$base\"\
        \ == *.dmg ]]; then\n    continue\n  fi\n\n  # Don't try to compress signature\
        \ bundles.\n  if [[ \"$base\" == *.sigstore ]]; then\n    continue\n  fi\n\
        \n  # Create per-binary tar.gz\n  tar -C \"$dest\" -czf \"$dest/${base}.tar.gz\"\
        \ \"$base\"\n\n  # Also create .zst and remove the uncompressed binaries to\
        \ keep\n  # non-Windows artifact directories small.\n  zstd -T0 -19 --rm \"\
        $dest/$base\"\ndone\n"
    - name: Suffix Bazel artifact filenames
      if: ${{ matrix.build-system == 'bazel' && runner.os != 'macOS' }}
      shell: bash
      run: "set -euo pipefail\nfor artifact in \"dist/${{ matrix.target }}\"/*; do\n\
        \  name=\"${artifact##*/}\"\n  stem=\"${name%%.*}\"\n  mv \"$artifact\" \"\
        ${artifact%/*}/${stem}-bazel${name#\"$stem\"}\"\ndone\n"
    - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      if: ${{ runner.os != 'macOS' }}
      with:
        name: ${{ matrix.artifact_name }}${{ env.ARTIFACT_SUFFIX }}
        path: 'codex-rs/dist/${{ matrix.target }}/*

          '
  build-macos-voice:
    name: Build voice runtime - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    environment:
      name: bazel
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: aarch64-apple-darwin
          runner: macos-15
          prefix: macos_aarch64
        - target: x86_64-apple-darwin
          runner: macos-15-intel
          prefix: macos_x86_64
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.12'
    - name: Prepare Bazel CI
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ matrix.target }}
        cache-scope: bazel-release-primary
    - name: Build matching helper and native runtime
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
        PREFIX: ${{ matrix.prefix }}
      run: "set -euo pipefail\n# Release tags bump Cargo.toml without rewriting the\
        \ workspace lockfile.\n# Refresh workspace versions before Bazel reads the\
        \ Cargo dependency graph.\n(cd codex-rs && cargo update --workspace)\npython3\
        \ .github/scripts/run_bazel_with_buildbuddy.py build --config=release \\\n\
        \  --macos_minimum_os=14.0 //codex-rs/voice-host:codex-voice-host //third_party/voice:native_runtime\n\
        runtime=\"bazel-bin/third_party/voice/native_runtime_${PREFIX}\"\nPYTHONPATH=third_party/voice\
        \ python3 - \"$runtime\" \"$TARGET\" <<'PY'\nfrom pathlib import Path\nimport\
        \ sys\nfrom package_runtime import runtime_files\nruntime_files(Path(sys.argv[1]).resolve(strict=True),\
        \ sys.argv[2])\nPY\nmkdir -p \"voice-unsigned/${TARGET}\"\ncp -R \"$runtime\"\
        \ \"voice-unsigned/${TARGET}/runtime\"\n# GNU tar extraction and signing need\
        \ writable copies of Bazel outputs.\nchmod -R u+w \"voice-unsigned/${TARGET}/runtime\"\
        \ncp bazel-bin/codex-rs/voice-host/codex-voice-host \"voice-unsigned/${TARGET}/codex-voice-host\"\
        \ntar -C \"voice-unsigned/${TARGET}\" -czf \"voice-unsigned-${TARGET}.tar.gz\"\
        \ runtime codex-voice-host\n"
    - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: voice-${{ matrix.target }}-unsigned
        path: voice-unsigned-${{ matrix.target }}.tar.gz
        if-no-files-found: error
